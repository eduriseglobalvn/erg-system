<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERG Slide Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #000;
        font-family: Arial, sans-serif;
      }

      .slide {
        aspect-ratio: 16 / 9;
        width: min(100vw - 160px, 1500px);
        max-height: calc(100vh - 80px);
        overflow: hidden;
        background:
          radial-gradient(circle at 26% 28%, rgba(65, 190, 218, 0.35), transparent 22%),
          linear-gradient(180deg, #fff 0 100%);
      }

      .top {
        display: flex;
        align-items: center;
        gap: 24px;
        height: 145px;
        padding: 0 90px;
        background: #4bb7c7;
        color: #fff;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .badge {
        display: grid;
        place-items: center;
        width: 90px;
        height: 90px;
        border: 5px solid #fff;
        border-radius: 50%;
        background: #e46b55;
      }

      .content {
        display: grid;
        place-items: center;
        height: calc(100% - 145px);
        padding: 70px;
        text-align: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 620px;
        border-radius: 999px;
        background: #54bbc5;
        padding: 24px 56px;
        color: #fff;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 60px 0 0;
        color: #e36b56;
        font-size: 42px;
      }

      .scene {
        margin: 40px auto 0;
        width: 470px;
        height: 250px;
        border-radius: 40px;
        background:
          radial-gradient(circle at 32% 60%, #f8d95b 0 13%, transparent 14%),
          radial-gradient(circle at 50% 52%, #355aa7 0 12%, transparent 13%),
          radial-gradient(circle at 68% 62%, #f1975a 0 13%, transparent 14%),
          linear-gradient(135deg, #eef8ff, #fef7f0);
        box-shadow: inset 0 0 0 2px rgba(15, 23, 42, 0.05);
      }
    </style>
  </head>
  <body>
    <main class="slide" aria-label="ERG local slide preview">
      <div class="top">
        <span>Unit</span>
        <span class="badge">1</span>
        <span>MY NEW SCHOOL</span>
      </div>
      <section class="content">
        <div>
          <div class="pill">LESSON 1: GETTING STARTED</div>
          <h1>A special day</h1>
          <div class="scene" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </body>
</html>
