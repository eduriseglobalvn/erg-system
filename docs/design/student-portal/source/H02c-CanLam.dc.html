<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Học sinh · Bài tập cần làm (mobile mới)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./erg.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.fr{position:relative;display:inline-grid;place-items:center;border-radius:50%;padding:3px;flex-shrink:0}
.fr>.av{border:2px solid #fff;margin:0}
.fr.t-go{background:repeating-linear-gradient(115deg,#8B5A2B 0 4px,#A9743F 4px 7px,#6E4520 7px 9px)}
.fr.t-sat{background:conic-gradient(from 200deg,#5B636E,#A3ABB5,#4A515B,#8E96A0,#5B636E)}
.fr.t-dong{background:conic-gradient(from 200deg,#9A4E1F,#E3A06B,#8A431A,#D08850,#9A4E1F)}
.fr.t-bac{background:conic-gradient(from 200deg,#8A94A6,#F4F6F9,#7C8698,#DCE1E8,#8A94A6)}
.fr.t-vang{background:conic-gradient(from 200deg,#B07A00,#FFE08A,#A86F00,#F2C94C,#B07A00);box-shadow:0 0 0 2px #FFF3CC}
.fr.t-bk{background:conic-gradient(from 200deg,#2E8F86,#B9F3EA,#227A72,#7FD9CD,#2E8F86);box-shadow:0 0 0 2px #DDF7F3}
.fr.t-kc{background:conic-gradient(from 200deg,#2D5BD8,#A8C8FF,#6C3FD1,#7FB2FF,#3B6CF0,#C9B6FF,#2D5BD8);box-shadow:0 0 0 2px #E3ECFF,0 0 14px rgba(59,108,240,.35)}
.fr.t-ct{background:conic-gradient(from 200deg,#7A1FA2,#F2C94C,#B0266B,#FFE08A,#7A1FA2);box-shadow:0 0 0 2px #FBE7FF,0 0 16px rgba(176,38,107,.35)}
.fr .gem{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);height:16px;min-width:16px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;border:1.5px solid #fff;white-space:nowrap}
.fr .crn{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:18px;color:#E2A400;filter:drop-shadow(0 1px 0 #8F6200)}
.g-go{background:#8B5A2B}.g-sat{background:#5B636E}.g-dong{background:#B4632B}.g-bac{background:#8A94A6}.g-vang{background:#C98A04}.g-bk{background:#2E8F86}.g-kc{background:linear-gradient(90deg,#2D5BD8,#6C3FD1)}.g-ct{background:linear-gradient(90deg,#7A1FA2,#B0266B)}
.emb{position:relative;display:inline-grid;place-items:center;clip-path:polygon(50% 0,100% 16%,100% 60%,50% 100%,0 60%,0 16%);color:#fff;font-weight:700}
.emb::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 50%);pointer-events:none}
.emb .ms{position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.emb.t-go{background:linear-gradient(#B07A45,#6E4520)}.emb.t-sat{background:linear-gradient(#A3ABB5,#4A515B)}.emb.t-dong{background:linear-gradient(#E3A06B,#8A431A)}.emb.t-bac{background:linear-gradient(#F4F6F9,#7C8698);color:#3D4553}
.emb.t-vang{background:linear-gradient(#FFE08A,#A86F00)}.emb.t-bk{background:linear-gradient(#B9F3EA,#227A72)}.emb.t-kc{background:linear-gradient(#A8C8FF,#3B6CF0 55%,#6C3FD1)}.emb.t-ct{background:linear-gradient(#FFE08A,#B0266B 45%,#7A1FA2)}
.tchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.tchip.t-bac{color:#3D4553;background:linear-gradient(90deg,#DCE1E8,#AEB6C3)}

.pbody>*{flex-shrink:0}
.due{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.due.wn{background:var(--wnt);color:var(--wnx)}.due.n{background:var(--nt);color:var(--tx2)}.due.er{background:var(--ert);color:var(--erx)}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5}
.bub.them{background:var(--bg2);border:1px solid var(--dv);border-top-left-radius:6px}
.bub.me{background:var(--p);color:#fff;border-top-right-radius:6px;margin-left:auto}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--tx3);padding:2px 10px;border-radius:999px;background:var(--bg2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--int);color:var(--inx)}
.rx{display:flex;gap:14px;align-items:center;font-size:12px;font-weight:600;color:var(--tx3)}
.rx span{display:inline-flex;align-items:center;gap:4px}
.comp{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--dv);background:#fff}
.comp .box{flex:1;min-height:44px;border:1px solid var(--bd);border-radius:22px;padding:11px 14px;color:var(--tx3);font-size:14px}
.cont{background:var(--p);color:#fff;border-color:var(--p)}
.cont .bar{background:rgba(255,255,255,.25)}.cont .bar>i{background:#fff}
</style>
</helmet>
<div class="phone" style="height:1000px">
  <div class="ptop">
    <h1 class="t-h1 f1">Bài tập</h1>
    <button type="button" class="ib" aria-label="Tìm bài"><span class="ms" aria-hidden="true">search</span></button>
  </div>
  <div class="pbody" style="gap:12px">
    <div class="seg"><button type="button" class="on">Cần làm <span class="cnt">4</span></button><button type="button">Đã nộp <span class="cnt">5</span></button><button type="button">Quá hạn <span class="cnt er">2</span></button></div>
    <section class="card col g8 cont" style="padding:16px" aria-labelledby="cont">
      <span class="row g4" style="font-size:11px;font-weight:700;opacity:.9"><span class="ms s" aria-hidden="true">play_circle</span>ĐANG LÀM DỞ · TOÁN</span>
      <h2 id="cont" style="margin:0;font-size:17px;font-weight:600;line-height:1.35">Luyện tập: Phương trình bậc nhất một ẩn</h2>
      <div style="font-size:13px;opacity:.88">12/20 câu · còn khoảng 6 phút · hạn 20:00 hôm nay</div>
      <div class="bar"><i style="width:60%"></i></div>
      <div class="row sp" style="margin-top:4px"><span class="bd nd" style="background:rgba(255,255,255,.18);color:#fff"><span class="ms f xs" aria-hidden="true">bolt</span>+50 XP</span><button type="button" class="btn" style="background:#fff;color:var(--p);padding:0 22px">Làm tiếp</button></div>
    </section>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div class="row sp" style="padding:4px 2px 0"><span class="t-ov">{{g.name}}</span><span class="t-m">{{g.sum}}</span></div>
      <sc-for list="{{g.items}}" as="a" hint-placeholder-count="2">
        <div class="card col g8" style="padding:14px 16px">
          <div class="row top g12">
            <span class="ico sm {{a.tone}}"><span class="ms f s" aria-hidden="true">{{a.icon}}</span></span>
            <div class="f1 col g2" style="min-width:0"><span class="b6">{{a.title}}</span><span class="t-m">{{a.meta}}</span></div>
          </div>
          <div class="row sp">
            <div class="row g8"><span class="due {{a.dueTone}}"><span class="ms xs" aria-hidden="true">schedule</span>{{a.left}}</span><span class="bd in nd">{{a.xp}}</span></div>
            <button type="button" class="btn o sm">{{a.cta}}</button>
          </div>
        </div>
      </sc-for>
    </sc-for>
  </div>
  <nav class="dock" aria-label="Điều hướng học sinh">
    <button type="button" class="dk" aria-label="Trang chủ"><span class="ms" aria-hidden="true">home</span></button>
    <button type="button" class="dk on" aria-current="page"><span class="ms f" aria-hidden="true">assignment</span>Bài tập</button>
    <button type="button" class="dk" aria-label="Thi đua"><span class="ms" aria-hidden="true">emoji_events</span></button>
    <button type="button" class="dk" aria-label="Hộp thư, 2 chưa đọc"><span class="ms" aria-hidden="true">inbox</span><span class="dot"></span></button>
    <button type="button" class="dk" aria-label="Hồ sơ, bậc Đồng 2"><span class="fr t-dong"><span class="av" style="width:26px;height:26px;font-size:9px;background:var(--p);color:#fff">MA</span></span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const a = function (icon, tone, title, meta, left, dueTone, xp, cta) { return { icon: icon, tone: tone, title: title, meta: meta, left: left, dueTone: dueTone, xp: xp, cta: cta }; };
    return {
      groups: [
        { name: 'Hôm nay', sum: '+40 XP', items: [
          a('quiz', '', 'Kiểm tra 15 phút: Đơn thức', 'Toán · 10 câu · làm 1 lần', 'Còn 4 giờ', 'wn', '+40 XP', 'Bắt đầu')
        ] },
        { name: 'Tuần này', sum: '2 bài · +55 XP', items: [
          a('menu_book', 'wn', 'Trắc nghiệm: Từ loại tiếng Việt', 'Ngữ văn · 10 câu', 'Ngày mai 21:00', 'n', '+30 XP', 'Bắt đầu'),
          a('translate', 'ok', 'Unit 4 · Vocabulary quiz', 'Tiếng Anh · 25 câu', 'Thứ Hai 16/11', 'n', '+25 XP', 'Bắt đầu')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
