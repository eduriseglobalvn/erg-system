    <!-- Critical CSS: injected inline so browser can render immediately without waiting for JS -->
    <style id="erg-critical-css">
      :root {
        --background: oklch(0.985 0.002 105);
        --foreground: oklch(0.23 0.01 105);
        --primary: oklch(0.55 0.12 185);
        --primary-foreground: oklch(0.99 0 0);

        --font-sans: "Public Sans", "IBM Plex Sans", -apple-system, sans-serif;
        --font-heading: "Fraunces", "Public Sans", serif;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      }
      html,body,#root{min-height:100%}
      body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
      *{box-sizing:border-box}
      a{text-decoration:none;color:inherit}
      button,input,select,textarea{font:inherit}
      button{border:0;background:transparent;padding:0;cursor:pointer}
      ::-webkit-scrollbar{width:6px;height:6px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:oklch(0.55 0 0 / 0.18);border-radius:9999px}
      ::-webkit-scrollbar-thumb:hover{background:oklch(0.5 0 0 / 0.3)}
      ::selection{background:oklch(0.55 0.12 185 / 0.18)}
      html{background:var(--background)}
      #root:empty{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--background)}
      #root:empty::after{content:"";width:64px;aspect-ratio:1;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:erg-spin 0.6s linear infinite}
      @keyframes erg-spin{to{transform:rotate(360deg)}}
    </style>
