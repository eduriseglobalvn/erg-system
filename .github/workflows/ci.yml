name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run verify
      - run: bun run contract:check
      - run: bun run test
      - run: bun run build
      - run: bun run budget:test
      - name: Bundle must not contain the auth bypass fixtures
        run: |
          if grep -rEl 'DEFAULT_BYPASS|dev-bypass|dev-admin-id|dev-student-id' dist; then
            echo "::error::Dev auth bypass fixtures leaked into the production bundle"; exit 1
          fi
      - name: Warn when mock fixtures are in the bundle (P0-6 debt, not yet blocking)
        run: |
          if grep -rEl 'sessionId:`mock-|source:`mock`' dist/assets; then
            echo "::warning::Mock fixtures are still bundled in production"
          fi
      - run: bun run budget:check
