name: Portal smoke E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/portal-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-smoke:
    name: Smoke ${{ matrix.portal }}
    # Playwright 1.60 has no Chromium build or deps list for ubuntu-latest (26.04); 24.04 is still a supported runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        portal: [lms, lcms, crm, elearning]
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run portal smoke
        run: bun run e2e:${{ matrix.portal }}

      - name: Upload portal report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.portal }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
