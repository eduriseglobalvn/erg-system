name: Portal smoke E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/portal-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-smoke:
    name: Smoke ${{ matrix.portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        portal: [lms, lcms, crm, elearning]
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run portal smoke
        run: bun run e2e:${{ matrix.portal }}

      - name: Upload portal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.portal }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
