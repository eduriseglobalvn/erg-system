name: Frontend transport integration

on:
  pull_request:
    paths:
      - "src/lib/api-client.ts"
      - "src/lib/graphql-client.ts"
      - "src/lib/query-client.ts"
      - "src/lib/query-key-scope.ts"
      - "src/platform/auth/api/**"
      - "src/test/api-graphql-integration-harness.ts"
      - "src/test/api-graphql.integration.test.ts"
      - "contracts/backend/**"
      - "scripts/api-contract-*.mjs"
      - "scripts/sync-api-contract.mjs"
      - "scripts/sync-graphql-contract.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend-transport-integration.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/api-client.ts"
      - "src/lib/graphql-client.ts"
      - "src/lib/query-client.ts"
      - "src/lib/query-key-scope.ts"
      - "src/platform/auth/api/**"
      - "src/test/api-graphql-integration-harness.ts"
      - "src/test/api-graphql.integration.test.ts"
      - "contracts/backend/**"
      - "scripts/api-contract-*.mjs"
      - "scripts/sync-api-contract.mjs"
      - "scripts/sync-graphql-contract.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend-transport-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify vendored API contracts
        run: bun run contract:check

      - name: Verify TypeScript integration
        run: bun run typecheck

      - name: Run API and GraphQL integration tests
        run: bun run test:transport-integration
