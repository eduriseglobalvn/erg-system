mutation TeachingCalendarEditScheduleSlot($input: EditTeachingScheduleSlotInput!) {
  editTeachingScheduleSlot(input: $input) { ...TeachingCalendarSlotChangeFields }
}

mutation TeachingCalendarSwapScheduleTeacher($input: SwapTeachingScheduleTeacherInput!) {
  swapTeachingScheduleTeacher(input: $input) { ...TeachingCalendarSlotChangeFields }
}
