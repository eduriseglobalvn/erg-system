# Included in every location that sets its own add_header (nginx does not inherit them).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Enforced. style-src keeps 'unsafe-inline' because Emotion/MUI inject <style> tags at runtime; script-src never does.
# Same value as vercel.json (src/test/csp-headers.policy.test.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.erg.edu.vn https://fonts.googleapis.com https://fonts.gstatic.com https://docs.google.com https://*.r2.cloudflarestorage.com; frame-src 'self' https://*.erg.edu.vn https://docs.google.com https://drive.google.com; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
